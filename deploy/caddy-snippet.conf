# 虾米看股：加到线上 /etc/caddy/Caddyfile 的 `:8080 { }` 块里。
# 真源与整体结构见 wiki/19-entry-safeline-caddy.md §3。
#
# 顺序要紧：这两段必须排在主站的 `handle { ... }` 兜底之前，否则全部落到主站静态页。
# 加完执行：sudo caddyctl validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy

    # ── 虾米看股 ─────────────────────────────────────────────────────────
    # 接口。/api/* 已经被主站 AI 闸口占用（转 8200），所以本应用另起前缀，
    # 用 handle_path 剥掉 /stocks-api 再转发 —— 后端看到的仍是 /api/v1/...，不用改一行。
    handle_path /stocks-api/* {
        request_body { max_size 8MB }
        reverse_proxy 127.0.0.1:8108
    }

    # 静态站。handle_path 同样剥掉 /stocks 前缀；SPA 全部回退 index.html。
    @stocksRoot path /stocks
    redir @stocksRoot /stocks/ 308
    handle_path /stocks/* {
        root * /srv/xiami-stocks/site/current
        try_files {path} {path}/ /index.html
        file_server
    }
